[package]
name = "granite-4-burn"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.17.0", features = ["ndarray"] }
burn-tch = { version = "0.17.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.4"
bincode = "1.3"
tokenizers = "0.21.1"
candle-core = "0.8"
anyhow = "1.0"
ndarray = { version = "0.15", features = ["serde"] }
ndarray-npy = "0.8"
clap = { version = "4.4", features = ["derive"] }
numpy = { version = "0.20", optional = true }
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
rand = "0.8.5"
mamba2-burn = { path = "../mamba2-burn" }

[features]
default = ["ndarray"]
tch-gpu = ["burn/tch", "burn/autodiff", "burn-tch"]
tch-cpu = ["burn/tch", "burn/autodiff", "burn-tch"]
ndarray = ["burn/ndarray", "burn/autodiff"]
python = ["dep:numpy", "dep:pyo3"]

[dev-dependencies]
burn = { version = "0.17.0", features = ["tch", "autodiff"] }
burn-tch = { version = "0.17.0" }
safetensors = "0.4"
serde_json = "1.0"
ndarray = "0.15"
ndarray-npy = "0.8"

[[bin]]
name = "vocab_utils"
path = "src/bin/vocab_utils.rs"

[[bin]]
name = "verification"
path = "src/bin/verification.rs"

[[bin]]
name = "generate_burn_reference"
path = "src/bin/generate_burn_reference.rs"

[[bin]]
name = "test_comparison"
path = "test_comparison.rs"

[[bin]]
name = "simplified_test"
path = "simplified_test.rs"

[[example]]
name = "debug_layer_comparison"
path = "examples/debug_layer_comparison.rs"

[[example]]
name = "debug_mamba_layer"
path = "examples/debug_mamba_layer.rs"

[[example]]
name = "debug_mamba_layer_tch"
path = "examples/debug_mamba_layer_tch.rs"

[[example]]
name = "debug_mamba_fixed"
path = "examples/debug_mamba_fixed.rs"
