[package]
name = "granite-4-burn"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.17.0", features = ["ndarray"] }
burn-tch = { version = "0.17.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.4"
bincode = "1.3"
tokenizers = "0.21.1"
anyhow = "1.0"

[features]
default = ["ndarray"]
tch-gpu = ["burn/tch", "burn/autodiff", "burn-tch"]
ndarray = ["burn/ndarray", "burn/autodiff"]

[dev-dependencies]
burn = { version = "0.17.0", features = ["tch", "autodiff"] }
burn-tch = { version = "0.17.0" }
safetensors = "0.4"
serde_json = "1.0"

[[bin]]
name = "vocab_utils"
path = "src/bin/vocab_utils.rs"
